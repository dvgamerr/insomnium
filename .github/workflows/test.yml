name: Test

on:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # - name: Lint markdown
      #   run: bun run lint:markdown
      
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Type checks
        run: bun run type-check

      - name: Test Insomnium
        working-directory: packages/insomnia
        run: bun run test
        if: always() # Run this even if the previous step already failed the run

      - name: Test Insomnium Testing
        working-directory: packages/insomnia-testing
        run: bun run test
        if: always() # Run this even if the previous step already failed the run

